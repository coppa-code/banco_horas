<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banco de Horas COPPA</title>
    
    <meta name="theme-color" content="#2E7D32">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Horas COPPA">
    
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 15px; color: #333; margin: 0; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { text-align: center; color: #2E7D32; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; }
        input[readonly] { background-color: #e9ecef; color: #666; cursor: not-allowed; }
        .row { display: flex; gap: 10px; flex-wrap: wrap; }
        .row .form-group { flex: 1; min-width: 45%; }
        
        button { width: 100%; padding: 15px; background-color: #2E7D32; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #1B5E20; }
        .btn-secundario { background-color: #0277bd; }
        .btn-secundario:hover { background-color: #01579b; }
        .btn-sair { background-color: #d32f2f; margin-bottom: 20px; }
        .btn-sair:hover { background-color: #b71c1c; }
        .btn-excluir { background-color: #d32f2f; color: white; border: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; margin-top: 10px; width: 100%; font-weight: bold; }
        
        .registro-card { background-color: #e8f5e9; border-left: 5px solid #2E7D32; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; flex-direction: column; }
        .registro-info { margin-bottom: 10px; }
        .resultado-box { margin-top: 15px; padding: 15px; background-color: #fff3e0; border-left: 5px solid #ff9800; border-radius: 4px; font-size: 18px; text-align: center; display: none; }
        .escondido { display: none !important; }
        .barra-topo { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-size: 14px; }
        .assinatura-resp { font-size: 13px; color: #0277bd; font-weight: bold; display: block; margin-top: 5px; }
        
        .box-coordenador { background-color: #e3f2fd; padding: 15px; border-radius: 4px; border-left: 4px solid #0277bd; margin-bottom: 20px; }
        .box-coordenador h3 { color: #0277bd; margin-top: 0; margin-bottom: 15px; font-size: 16px; text-align: left; }
    </style>
</head>
<body>

<div id="tela-login" class="container">
    <h1>COPPA - Acesso</h1>
    <p style="text-align: center; color: #666; font-size: 14px;">
        <strong>Usuários do Sistema:</strong><br>
        coordenador - Coordenador de Área<br>
        supervisor - Oficial Supervisor
    </p>
    <div class="form-group"><label>Usuário:</label><input type="text" id="login-usuario" placeholder="Digite seu usuário"></div>
    <div class="form-group"><label>Senha:</label><input type="password" id="login-senha" placeholder="Digite sua senha"></div>
    <button id="btn-entrar" onclick="fazerLogin()">Entrar no Sistema</button>
</div>

<div id="tela-sistema" class="escondido">
    <div class="container barra-topo">
        <div>Perfil: <strong id="nome-usuario-logado"></strong></div>
        <button class="btn-sair" style="width: auto; padding: 8px 15px; margin: 0;" onclick="fazerLogout()">Sair</button>
    </div>

    <div id="bloco-efetivo" class="container escondido">
        <h2>Cadastrar Policial (Coordenador)</h2>
        <form id="form-efetivo">
            <div class="row">
                <div class="form-group">
                    <label>Função no Sistema:</label>
                    <select id="novo-funcao" required>
                        <option value="policial">Apenas Policial (Tira Serviço)</option>
                        <option value="coordenador">Apenas Coordenador</option>
                        <option value="ambos">Ambos (Tira Serviço e Coordena)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Graduação:</label>
                    <select id="novo-graduacao" required>
                        <option value="">Selecione...</option>
                        <option value="SD PM">SD PM</option>
                        <option value="CB PM">CB PM</option>
                        <option value="1º SGT PM">1º SGT PM</option>
                        <option value="ST PM">ST PM</option>
                        <option value="TEN PM">TEN PM</option>
                        <option value="CAP PM">CAP PM</option>
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="form-group"><label>Matrícula:</label><input type="text" id="novo-matricula" placeholder="Ex: 30564615" required></div>
                <div class="form-group"><label>Nome de Guerra:</label><input type="text" id="novo-nome" placeholder="Ex: Santos" required></div>
            </div>
            <button type="submit" class="btn-secundario">Salvar no Banco de Dados</button>
        </form>
    </div>

    <div id="bloco-lancamento" class="container">
        <h2>Lançamento de Serviço</h2>
        <form id="form-lancamento">
            
            <div class="box-coordenador">
                <h3>Dados do Coordenador (Responsável)</h3>
                <div class="row">
                    <div class="form-group" style="flex: 1;">
                        <label for="coord-graduacao">Graduação:</label>
                        <select id="coord-graduacao" required>
                            <option value="">Selecione...</option>
                            <option value="SD PM">SD PM</option>
                            <option value="CB PM">CB PM</option>
                            <option value="1º SGT PM">1º SGT PM</option>
                            <option value="ST PM">ST PM</option>
                            <option value="TEN PM">TEN PM</option>
                            <option value="CAP PM">CAP PM</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1.5;">
                        <label for="coord-nome">Nome de Guerra:</label>
                        <select id="coord-nome" required>
                            <option value="">Selecione a graduação primeiro...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group" style="margin-bottom: 0;">
                    <label for="coord-matricula">Matrícula do Coordenador:</label>
                    <input type="text" id="coord-matricula" placeholder="Preenchimento automático" required readonly>
                </div>
            </div>

            <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">

            <div class="form-group">
                <label for="select-policial">Policial que assumiu o serviço:</label>
                <select id="select-policial" required></select>
            </div>
            <div class="row">
                <div class="form-group"><label>Graduação:</label><input type="text" id="input-graduacao" readonly></div>
                <div class="form-group"><label>Matrícula:</label><input type="text" id="input-matricula" readonly></div>
            </div>
            <div class="form-group"><label>Data do Serviço:</label><input type="date" id="input-data" required></div>
            <div class="row">
                <div class="form-group"><label>Hora de Entrada:</label><input type="time" id="input-entrada" required></div>
                <div class="form-group"><label>Hora de Saída:</label><input type="time" id="input-saida" required></div>
            </div>
            <button type="submit" id="btn-lancar">Lançar Horas e Assinar</button>
        </form>
    </div>

    <div id="bloco-relatorios" class="container escondido">
        <h2>Consultar Banco de Horas</h2>
        <div class="form-group"><label for="filtro-policial">Policial:</label><select id="filtro-policial"></select></div>
        <div class="form-group"><label for="filtro-mes">Mês e Ano:</label><input type="month" id="filtro-mes"></div>
        <button class="btn-secundario" onclick="buscarRelatorio()">Calcular Total Mensal</button>
        <div id="resultado-horas" class="resultado-box"></div>
    </div>

    <div class="container">
        <h2>Últimos Lançamentos</h2>
        <div id="lista-registros">
            <p style="text-align: center; color: #666;">Carregando banco de dados...</p>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getDatabase, ref, push, get, query, orderByChild, equalTo, remove } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCneLbc1ghgAKlUSIMVs7WYNKC_EjYwW7M",
        authDomain: "banco-de-horas-57c35.firebaseapp.com",
        databaseURL: "https://banco-de-horas-57c35-default-rtdb.firebaseio.com",
        projectId: "banco-de-horas-57c35",
        storageBucket: "banco-de-horas-57c35.firebasestorage.app",
        messagingSenderId: "172937844198",
        appId: "1:172937844198:web:1737f0bc529b7fd458b227"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const auth = getAuth(app); 

    let efetivoDinamico = []; 
    let usuarioLogadoAtual = null;

    // Elementos do Coordenador
    const coordGraduacao = document.getElementById('coord-graduacao');
    const coordNome = document.getElementById('coord-nome');
    const coordMatricula = document.getElementById('coord-matricula');

    // Elementos do PM do Serviço
    const selectPolicial = document.getElementById('select-policial');
    const filtroPolicial = document.getElementById('filtro-policial');
    const inputGraduacao = document.getElementById('input-graduacao');
    const inputMatricula = document.getElementById('input-matricula');
    
    const formLancamento = document.getElementById('form-lancamento');
    const formEfetivo = document.getElementById('form-efetivo');
    const listaRegistros = document.getElementById('lista-registros');
    const btnLancar = document.getElementById('btn-lancar');
    const btnEntrar = document.getElementById('btn-entrar');

    coordGraduacao.addEventListener('change', function() {
        const gradSelecionada = this.value;
        coordMatricula.value = ""; 
        
        if (gradSelecionada === "") {
            coordNome.innerHTML = '<option value="">Selecione a graduação primeiro...</option>';
            return;
        }

        coordNome.innerHTML = '<option value="">Selecione o nome...</option>';
        
        const coordenadoresFiltrados = efetivoDinamico.filter(c => 
            c.graduacao === gradSelecionada && 
            (c.funcao === 'coordenador' || c.funcao === 'ambos')
        );
        
        if (coordenadoresFiltrados.length === 0) {
            coordNome.innerHTML = '<option value="">Nenhum Coordenador nesta graduação</option>';
            return;
        }

        coordenadoresFiltrados.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(coord => {
            const opt = document.createElement('option');
            opt.value = coord.nome;
            opt.textContent = coord.nome;
            opt.dataset.matricula = coord.matricula;
            coordNome.appendChild(opt);
        });
    });

    coordNome.addEventListener('change', function() {
        const optionSelecionada = this.options[this.selectedIndex];
        
        if (optionSelecionada && optionSelecionada.value) {
            coordMatricula.value = optionSelecionada.dataset.matricula;
            
            const dadosSalvos = {
                graduacao: coordGraduacao.value,
                nome: coordNome.value,
                matricula: coordMatricula.value
            };
            localStorage.setItem('dadosCoordenadorSalvo', JSON.stringify(dadosSalvos));
        } else {
            coordMatricula.value = "";
        }
    });

    onAuthStateChanged(auth, (user) => {
        if (user) {
            if (user.email === "coordenador@coppa.com.br") {
                usuarioLogadoAtual = { perfil: "coordenador", nome: "Módulo Coordenador de Área" };
            } else if (user.email === "supervisor@coppa.com.br") {
                usuarioLogadoAtual = { perfil: "supervisor", nome: "Módulo Oficial Supervisor" };
            }
            
            document.getElementById('tela-login').classList.add('escondido');
            document.getElementById('tela-sistema').classList.remove('escondido');
            document.getElementById('nome-usuario-logado').textContent = usuarioLogadoAtual.nome;

            if (usuarioLogadoAtual.perfil === "coordenador") {
                document.getElementById('bloco-relatorios').classList.add('escondido');
                document.getElementById('bloco-efetivo').classList.add('escondido');
            } else {
                document.getElementById('bloco-relatorios').classList.remove('escondido');
                document.getElementById('bloco-efetivo').classList.remove('escondido');
            }
            
            carregarEfetivoDoFirebase();
            carregarRegistrosDoFirebase(); 
        } else {
            usuarioLogadoAtual = null;
            document.getElementById('tela-sistema').classList.add('escondido');
            document.getElementById('tela-login').classList.remove('escondido');
            document.getElementById('login-usuario').value = "";
            document.getElementById('login-senha').value = "";
            document.getElementById('resultado-horas').style.display = 'none'; 
        }
        btnEntrar.disabled = false;
        btnEntrar.textContent = "Entrar no Sistema";
    });

    window.fazerLogin = async function() {
        const user = document.getElementById('login-usuario').value.toLowerCase().trim();
        const pass = document.getElementById('login-senha').value;

        if(!user || !pass) {
            alert("Preencha usuário e senha.");
            return;
        }

        btnEntrar.disabled = true;
        btnEntrar.textContent = "Verificando autorização...";

        let emailFirebase = "";
        if (user === "coordenador") {
            emailFirebase = "coordenador@coppa.com.br";
        } else if (user === "supervisor") {
            emailFirebase = "supervisor@coppa.com.br";
        } else {
            alert("Usuário não reconhecido. Use 'coordenador' ou 'supervisor'.");
            btnEntrar.disabled = false;
            btnEntrar.textContent = "Entrar no Sistema";
            return;
        }

        try {
            await signInWithEmailAndPassword(auth, emailFirebase, pass);
        } catch (error) {
            alert("Senha ou usuário incorretos! Acesso negado.");
            btnEntrar.disabled = false;
            btnEntrar.textContent = "Entrar no Sistema";
        }
    };

    window.fazerLogout = async function() {
        try {
            await signOut(auth); 
        } catch (error) {
            console.error("Erro ao sair", error);
        }
    };

    function preencherDadosCoordenadorSalvos() {
        const dadosCoordSalvos = JSON.parse(localStorage.getItem('dadosCoordenadorSalvo'));
        if (dadosCoordSalvos) {
            coordGraduacao.value = dadosCoordSalvos.graduacao || "";
            coordGraduacao.dispatchEvent(new Event('change')); 
            
            setTimeout(() => {
                coordNome.value = dadosCoordSalvos.nome || "";
                if (coordNome.value) {
                    coordMatricula.value = dadosCoordSalvos.matricula || "";
                }
            }, 50);
        }
    }

    formEfetivo.addEventListener('submit', async function(evento) {
        evento.preventDefault();
        const novoPM = {
            funcao: document.getElementById('novo-funcao').value,
            graduacao: document.getElementById('novo-graduacao').value,
            matricula: document.getElementById('novo-matricula').value,
            nome: document.getElementById('novo-nome').value
        };
        try {
            await push(ref(db, 'efetivo'), novoPM);
            alert("Policial cadastrado com sucesso!");
            document.getElementById('novo-funcao').value = "policial";
            document.getElementById('novo-graduacao').value = "";
            document.getElementById('novo-matricula').value = "";
            document.getElementById('novo-nome').value = "";
            carregarEfetivoDoFirebase(); 
        } catch (erro) {
            alert("Erro ao cadastrar policial.");
        }
    });

    async function carregarEfetivoDoFirebase() {
        try {
            const snapshot = await get(ref(db, 'efetivo'));
            efetivoDinamico = []; 
            if (snapshot.exists()) {
                const dados = snapshot.val();
                for (let key in dados) { efetivoDinamico.push(dados[key]); }
            }
            atualizarSelects();
            preencherDadosCoordenadorSalvos(); 
        } catch (erro) {}
    }

    // --- CORREÇÃO 1: LISTA DROPDOWN LIMPA ---
    function atualizarSelects() {
        const optionVazia = '<option value="">-- Escolha um policial --</option>';
        selectPolicial.innerHTML = optionVazia; filtroPolicial.innerHTML = optionVazia;
        
        const pmServico = efetivoDinamico.filter(pm => pm.funcao === 'policial' || pm.funcao === 'ambos' || !pm.funcao);
        
        pmServico.sort((a, b) => a.nome.localeCompare(b.nome)).forEach(pm => {
            // Agora mostra apenas o Nome de Guerra no visual do dropdown
            const optionTexto = `${pm.nome}`; 
            
            const opt1 = document.createElement('option'); 
            opt1.value = pm.matricula; 
            opt1.textContent = optionTexto;
            selectPolicial.appendChild(opt1);
            
            const opt2 = document.createElement('option'); 
            opt2.value = pm.matricula; 
            opt2.textContent = optionTexto;
            filtroPolicial.appendChild(opt2);
        });
    }

    // --- CORREÇÃO 2: BUSCA E PREENCHIMENTO AUTOMÁTICO CORRIGIDO ---
    selectPolicial.addEventListener('change', function() {
        // O String() garante que a busca não falhe por divergência de tipo (texto/número)
        const pmSelecionado = efetivoDinamico.find(pm => String(pm.matricula) === String(this.value));
        if (pmSelecionado) {
            // Preenche os campos debaixo instantaneamente
            inputGraduacao.value = pmSelecionado.graduacao;
            inputMatricula.value = pmSelecionado.matricula;
        } else {
            inputGraduacao.value = ""; inputMatricula.value = "";
        }
    });

    function calcularDiferencaHoras(entrada, saida) {
        const dataEntrada = new Date(`2000-01-01T${entrada}:00`);
        let dataSaida = new Date(`2000-01-01T${saida}:00`);
        if (dataSaida < dataEntrada) { dataSaida.setDate(dataSaida.getDate() + 1); }
        return (dataSaida - dataEntrada) / (1000 * 60 * 60);
    }

    function formatarHorasParaRelogio(horasDecimais) {
        let horas = Math.floor(horasDecimais);
        let minutos = Math.round((horasDecimais - horas) * 60);
        
        if (minutos === 60) {
            horas += 1;
            minutos = 0;
        }
        
        const horaStr = horas.toString().padStart(2, '0');
        const minStr = minutos.toString().padStart(2, '0');
        
        return `${horaStr}:${minStr}`;
    }

    formLancamento.addEventListener('submit', async function(evento) {
        evento.preventDefault();
        btnLancar.disabled = true;
        btnLancar.textContent = "Salvando...";

        const matricula = selectPolicial.value;
        const pmObj = efetivoDinamico.find(pm => String(pm.matricula) === String(matricula));
        const dataServico = document.getElementById('input-data').value;
        const mesAno = dataServico.substring(0, 7); 
        
        const assinaturaFormatada = `${coordGraduacao.value} ${coordNome.value} (Mat: ${coordMatricula.value})`;

        const novoRegistro = {
            matricula: matricula,
            graduacao: pmObj.graduacao,
            nome_pm: pmObj.nome,
            data_servico: dataServico,
            mes_ano: mesAno, 
            hora_entrada: document.getElementById('input-entrada').value,
            hora_saida: document.getElementById('input-saida').value,
            total_horas: calcularDiferencaHoras(document.getElementById('input-entrada').value, document.getElementById('input-saida').value),
            responsavel_lancamento: assinaturaFormatada,
            criado_em: new Date().toISOString()
        };

        try {
            await push(ref(db, 'registros_servico'), novoRegistro);
            
            document.getElementById('input-data').value = "";
            document.getElementById('input-entrada').value = "";
            document.getElementById('input-saida').value = "";
            
            alert("Lançamento assinado e salvo!");
            carregarRegistrosDoFirebase(); 
        } catch (erro) {
            alert("Erro ao salvar.");
        } finally {
            btnLancar.disabled = false; btnLancar.textContent = "Lançar Horas e Assinar";
        }
    });

    async function carregarRegistrosDoFirebase() {
        listaRegistros.innerHTML = '<p style="text-align: center; color: #666;">Buscando registros...</p>';
        try {
            const snapshot = await get(ref(db, 'registros_servico'));
            listaRegistros.innerHTML = "";
            
            if (!snapshot.exists()) {
                listaRegistros.innerHTML = '<p style="color: #666; font-style: italic; text-align: center;">Nenhum serviço lançado ainda.</p>';
                return;
            }
            
            const dados = snapshot.val();
            const registros = [];
            for (let idNoFirebase in dados) {
                let reg = dados[idNoFirebase];
                reg.id_firebase = idNoFirebase;
                registros.push(reg);
            }

            registros.reverse().forEach(reg => {
                const dataFormatada = reg.data_servico.split('-').reverse().join('/');
                const responsavel = reg.responsavel_lancamento ? reg.responsavel_lancamento : "Não identificado";

                const tempoCriacao = new Date(reg.criado_em).getTime();
                const tempoAtual = Date.now();
                const dezMinutosEmMilissegundos = 10 * 60 * 1000;
                const diferencaTempo = tempoAtual - tempoCriacao;

                let htmlBotaoExcluir = "";
                
                if (usuarioLogadoAtual && (usuarioLogadoAtual.perfil === "supervisor" || (usuarioLogadoAtual.perfil === "coordenador" && diferencaTempo <= dezMinutosEmMilissegundos))) {
                    htmlBotaoExcluir = `<button class="btn-excluir" onclick="apagarLancamento('${reg.id_firebase}')">Excluir</button>`;
                }

                const horasExibicao = formatarHorasParaRelogio(Number(reg.total_horas));

                const div = document.createElement('div');
                div.className = 'registro-card';
                div.innerHTML = `
                    <div class="registro-info">
                        <strong>${reg.graduacao} ${reg.nome_pm}</strong><br>
                        Data: ${dataFormatada} | Turno: ${reg.hora_entrada} às ${reg.hora_saida}<br>
                        <strong>Carga: <span style="color: #d32f2f;">${horasExibicao}</span></strong>
                        <span class="assinatura-resp">✍️ Resp: ${responsavel}</span>
                    </div>
                    ${htmlBotaoExcluir}
                `;
                listaRegistros.appendChild(div);
            });
        } catch (erro) {
            listaRegistros.innerHTML = '<p style="color: red; text-align: center;">Erro ao carregar histórico.</p>';
        }
    }

    window.apagarLancamento = async function(idFirebase) {
        if(confirm("Tem certeza que deseja apagar este lançamento?")) {
            try {
                await remove(ref(db, `registros_servico/${idFirebase}`));
                carregarRegistrosDoFirebase(); 
            } catch (erro) {
                alert("Erro ao apagar o registro.");
            }
        }
    };

    window.buscarRelatorio = async function() {
        const matriculaBusca = filtroPolicial.value;
        const mesAnoBusca = document.getElementById('filtro-mes').value;
        if (!matriculaBusca || !mesAnoBusca) { alert("Selecione o policial e o mês."); return; }
        const boxResultado = document.getElementById('resultado-horas');
        boxResultado.style.display = "block"; boxResultado.innerHTML = "Calculando horas...";

        try {
            const q = query(ref(db, 'registros_servico'), orderByChild('matricula'), equalTo(matriculaBusca));
            const snapshot = await get(q);
            let totalHoras = 0; let qtd = 0;
            if (snapshot.exists()) {
                const registros = Object.values(snapshot.val());
                registros.filter(reg => reg.mes_ano === mesAnoBusca).forEach((reg) => {
                    totalHoras += Number(reg.total_horas); qtd++;
                });
            }
            
            const pmObj = efetivoDinamico.find(pm => String(pm.matricula) === String(matriculaBusca));
            
            const totalFormatado = formatarHorasParaRelogio(totalHoras);

            boxResultado.innerHTML = `
                <strong>${pmObj.graduacao} ${pmObj.nome}</strong><br>
                Mês: ${mesAnoBusca.split('-').reverse().join('/')}<br><br>
                <strong>Total Trabalhado: <span style="font-size: 24px; color: #d32f2f;">${totalFormatado} horas</span></strong><br>
                <span style="font-size: 14px; color: #666;">Em ${qtd} plantão(ões) encontrado(s)</span>
            `;
        } catch (erro) { boxResultado.innerHTML = '<span style="color: red;">Erro no servidor.</span>'; }
    };
</script>
</body>
</html>
